name: Laffha QA

on:
  push:
    branches: [main]
    paths:
      - 'qa-tests/**'
      - '.github/workflows/laffha-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run multiplayer synchronization unit and stress tests
        run: node --test qa-tests/multiplayer-v72.test.mjs
      - name: Install Playwright
        run: |
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait briefly for Vercel production deployment
        run: sleep 45
      - name: Run QA
        run: node qa-tests/run-qa.mjs
      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laffha-qa-report
          path: qa-output
          if-no-files-found: warn
