name: Supabase V64 E2E
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-e2e-v62.yml'
      - 'secure-runtime-v62.js'
      - 'lifelines-once-v62.js'
      - 'public-question-bank.js'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify answer checking and secure Choices mode
        shell: bash
        run: |
          node <<'NODE'
          const url='https://ntklwkzrozyfgzwwkvfr.supabase.co';
          const key='sb_publishable_FBTPjHlnOBumsqw340LF3Q_KGhmYCDp';
          async function post(path, body, token=key){
            const r=await fetch(url+path,{method:'POST',headers:{apikey:key,authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify(body)});
            const text=await r.text(); let data; try{data=JSON.parse(text)}catch{data={raw:text}};
            if(!r.ok) throw new Error(`${path} ${r.status}: ${text}`); return data;
          }
          const auth=await post('/auth/v1/signup',{});
          const token=auth.access_token || auth.session?.access_token;
          if(!token) throw new Error('Anonymous auth did not return access token');
          const started=Date.now();
          const good=await post('/functions/v1/laffha-answer',{questionId:'gen27-e-20',answer:'المحيط الهادئ، المحيط الأطلسي، المحيط الهندي، المحيط الجنوبي، المحيط المتجمد الشمالي',teamNo:1,mode:'answer'},token);
          if(good.correct!==true) throw new Error('Known correct answer was rejected');
          const bad=await post('/functions/v1/laffha-answer',{questionId:'gen27-e-20',answer:'إجابة خاطئة تمامًا',teamNo:1,mode:'answer'},token);
          if(bad.correct!==false) throw new Error('Known wrong answer was accepted');
          const choices=await post('/functions/v1/laffha-answer',{questionId:'tv27-e-01',answer:'',teamNo:1,mode:'choices'},token);
          if(!Array.isArray(choices.options)||choices.options.length<2||choices.options.length>4) throw new Error(`Choices mode returned invalid options: ${JSON.stringify(choices)}`);
          if('correct' in choices||'correctAnswer' in choices||'answer' in choices) throw new Error('Choices mode leaked answer metadata');
          console.log(`SUPABASE_V64_E2E_OK ${Date.now()-started}ms choices=${choices.options.length}`);
          NODE