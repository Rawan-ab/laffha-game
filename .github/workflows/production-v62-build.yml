name: Production V74 build
on:
  push:
    branches: [main]
    paths:
      - 'tools/build-production-v62.mjs'
      - 'secure-v62.html'
      - 'approved-setup-v69.css'
      - 'approved-setup-v69.js'
      - 'setup-reference-v71.js'
      - 'category-hold-v73.js'
      - 'countries-category-v74.js'
      - 'multiplayer-fast-v66.js'
      - 'public-question-bank.js'
      - 'ui-speed-v63.js'
      - 'secure-runtime-v62.js'
      - 'lifelines-once-v62.js'
      - 'setup-design-v15.js'
      - 'supabase-config.js'
      - 'multiplayer-v56.js'
      - 'multiplayer-sync-v57.js'
      - 'multiplayer-typed-secure-v62.js'
      - 'controller.html'
      - 'vercel.json'
      - '.github/workflows/production-v62-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-production-v62.mjs
      - name: Verify V74 held category + V66 multiplayer
        run: |
          test -f dist/index.html
          test -f dist/controller.html
          test -f dist/public-question-bank.js
          test -f dist/multiplayer-fast-v66.js
          test -f dist/approved-setup-v69.css
          test -f dist/approved-setup-v69.js
          test -f dist/category-hold-v73.js
          test -f dist/countries-category-v74.js
          test ! -e dist/questions.js
          test ! -e dist/migration/question-bank-export.json
          ! grep -q '"correctAnswer"' dist/public-question-bank.js
          ! grep -q '"acceptedAnswers"' dist/public-question-bank.js
          ! grep -q '"correctAnswer"' dist/countries-category-v74.js
          grep -q "name:'دول العالم'" dist/countries-category-v74.js
          grep -q "questionCount:incoming.length" dist/countries-category-v74.js
          grep -q 'content="74"' dist/index.html
          grep -q 'approved-setup-v69.css?v=74' dist/index.html
          grep -q 'approved-setup-v69.js?v=74' dist/index.html
          grep -q 'multiplayer-fast-v66.js?v=74' dist/index.html
          grep -q 'category-hold-v73.js?v=74' dist/index.html
          grep -q 'countries-category-v74.js?v=74' dist/index.html
          grep -Fq "filter(([k])=>k!=='logos')" dist/setup-reference-v71.js
          grep -Fq "filter(key=>key!==HELD_CATEGORY)" dist/category-hold-v73.js
          grep -q 'laffha-fast-v66-' dist/controller.html
          grep -q 'pollTimer=setInterval(refreshGameState,5000)' dist/controller.html
          grep -q "event:'action'" dist/multiplayer-fast-v66.js
          grep -q "event:'state'" dist/controller.html
          echo PRODUCTION_V74_HELD_CATEGORY_OK
