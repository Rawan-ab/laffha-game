name: Production V64 build
on:
  push:
    branches: [main]
    paths:
      - 'tools/build-production-v62.mjs'
      - 'secure-v62.html'
      - 'public-question-bank.js'
      - 'ui-speed-v63.js'
      - 'secure-runtime-v62.js'
      - 'lifelines-once-v62.js'
      - 'setup-design-v15.js'
      - 'supabase-config.js'
      - 'multiplayer-v56.js'
      - 'multiplayer-sync-v57.js'
      - 'multiplayer-typed-secure-v62.js'
      - 'controller.html'
      - 'vercel.json'
      - '.github/workflows/production-v62-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-production-v62.mjs
      - name: Verify secure V64 production build
        run: |
          test -f dist/index.html
          test -f dist/controller.html
          test -f dist/public-question-bank.js
          test -f dist/lifelines-once-v62.js
          test -f dist/ui-speed-v63.js
          test ! -e dist/questions.js
          test ! -e dist/migration/question-bank-export.json
          ! grep -q '"correctAnswer"' dist/public-question-bank.js
          ! grep -q '"acceptedAnswers"' dist/public-question-bank.js
          grep -q 'content="64"' dist/index.html
          grep -q 'lifelines-once-v62.js?v=64' dist/index.html
          grep -q 'ui-speed-v63.js?v=64' dist/controller.html
          grep -q 'pollTimer=setInterval(refreshGameState,3500)' dist/controller.html
          grep -q 'Array.isArray(x.options)&&x.options.length' dist/controller.html
          grep -q 'Math.floor(before/2)' dist/lifelines-once-v62.js
          grep -q '🧩 خيارات' dist/lifelines-once-v62.js
          echo PRODUCTION_V64_LIFELINES_OK
