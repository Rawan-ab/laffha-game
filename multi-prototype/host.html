<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لفّها | شاشة العرض</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div class="brand">لفّها</div><div class="tag">شاشة العرض · Prototype</div></div><div class="host-grid"><section class="card room-card"><div class="label">رمز الغرفة</div><div class="room-code" id="roomCode">7K2M</div><div class="qr" aria-label="QR تجريبي"></div><button class="btn secondary full" id="newCode">توليد كود تجريبي</button><div class="demo-note">حاليًا هذه شاشة تصميم فقط. الربط الحقيقي والـQR الفعلي نضيفهم لاحقًا بدون لمس اللعبة الأساسية.</div></section><section class="card status-card"><h2>الفرق المتصلة</h2><div class="team-row"><div class="team-meta"><span class="dot" style="background:var(--purple2)"></span><div><strong>الفريق البنفسجي</strong><div class="label">جوال الفريق</div></div></div><span class="ready">جاهز</span></div><div class="team-row"><div class="team-meta"><span class="dot" style="background:var(--blue)"></span><div><strong>الفريق الأزرق</strong><div class="label">جوال الفريق</div></div></div><span class="waiting" id="blueStatus">في الانتظار</span></div><div class="team-row" style="border-style:dashed;opacity:.65"><div class="team-meta"><span>＋</span><div><strong>فريق إضافي</strong><div class="label">يظهر هنا بعد الانضمام</div></div></div><span class="waiting">غير متصل</span></div><button class="btn primary full" style="margin-top:14px" id="demoJoin">محاكاة اتصال الفريق الأزرق</button><button class="btn secondary full" style="margin-top:9px" disabled>ابدأ اللعبة — يفعّل بعد الربط</button></section></div></div><script>const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';function code(){return Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}document.getElementById('newCode').onclick=()=>document.getElementById('roomCode').textContent=code();document.getElementById('demoJoin').onclick=()=>{const s=document.getElementById('blueStatus');s.className='ready';s.textContent='جاهز'};</script></body></html>
